<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ders Defteri</title>
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ders Defteri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Düzen: telefon için tek sütun, altta sekmeler, formlar alttan açılan sayfalar.
   Renk: soğuk gri zemin, koyu mavi-lacivert mürekkep, kobalt vurgu; özel = kobalt, grup = camgöbeği. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E8ECF1; --ink:#16202B; --ink2:#566271; --line:#DCE1E8;
  --accent:#2D4FD6; --accent-ink:#FFFFFF; --accent-soft:#E3E9FC;
  --ozel:#2D4FD6; --ozel-soft:#E3E9FC; --grup:#0B7F82; --grup-soft:#D9F0EF;
  --ok:#1B7F52; --ok-soft:#DFF3E8; --warn:#8F5A00; --warn-soft:#FBEFD3; --bad:#BE3A2B; --bad-soft:#FBE3DF;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Sora','Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1620; --surface:#17212D; --surface2:#212D3B; --ink:#E8EDF3; --ink2:#9CA9B8; --line:#2A3746;
  --accent:#8AA2FF; --accent-ink:#0B1020; --accent-soft:#1F2B55;
  --ozel:#8AA2FF; --ozel-soft:#1F2B55; --grup:#4CC7C9; --grup-soft:#123A3B;
  --ok:#4DCB92; --ok-soft:#12362A; --warn:#E5B04A; --warn-soft:#3A2E10; --bad:#FF8B7B; --bad-soft:#43201B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1620; --surface:#17212D; --surface2:#212D3B; --ink:#E8EDF3; --ink2:#9CA9B8; --line:#2A3746;
  --accent:#8AA2FF; --accent-ink:#0B1020; --accent-soft:#1F2B55;
  --ozel:#8AA2FF; --ozel-soft:#1F2B55; --grup:#4CC7C9; --grup-soft:#123A3B;
  --ok:#4DCB92; --ok-soft:#12362A; --warn:#E5B04A; --warn-soft:#3A2E10; --bad:#FF8B7B; --bad-soft:#43201B; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:68px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{max-width:560px;margin-inline:auto}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h1{font-size:25px;line-height:1.15;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
h3{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.mut{color:var(--ink2)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 16px}
.ph .d{color:var(--ink2);font-size:13px;margin-top:2px}
.sec{margin-top:22px}
.sec>.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:8px 0;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}

/* satırlar */
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.row>.main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:12px 14px;cursor:pointer;border-radius:14px}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:3px}
.tm{display:flex;flex-direction:column;align-items:flex-start;min-width:44px;font-variant-numeric:tabular-nums;line-height:1.2}
.tm b{font-size:14px}.tm i{font-style:normal;font-size:12px;color:var(--ink2)}
.tm.wide{min-width:68px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.done{display:flex;align-items:center;gap:4px;margin-right:10px;background:var(--ok-soft);color:var(--ok);border:0;border-radius:10px;min-height:40px;padding:0 12px;font-weight:700;font-size:13px;cursor:pointer}
.done svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* etiketler */
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;line-height:1.6;white-space:nowrap}
.chip.ozel{background:var(--ozel-soft);color:var(--ozel)}
.chip.grup{background:var(--grup-soft);color:var(--grup)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.mute{background:var(--surface2);color:var(--ink2)}

/* sayı kutuları */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--ink2);font-weight:600}
.tile .v{font-family:var(--font-head);font-size:21px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--ink2);margin-top:1px}
.tile.bad .v{color:var(--bad)}.tile.ok .v{color:var(--ok)}
.strip{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.strip>div{flex:1;padding:10px 12px;min-width:0}
.strip>div+div{border-left:1px solid var(--line)}
.strip .k{font-size:11.5px;color:var(--ink2);font-weight:600}
.strip .v{font-family:var(--font-head);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn svg,.fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btns .btn{flex:1 1 140px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick .btn{flex-direction:column;gap:2px;min-height:62px;font-size:13px;padding:8px 4px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:6px;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 6px 18px rgba(20,30,60,.28);cursor:pointer}

/* segment, filtre */
.segb{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.segb button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-weight:700;font-size:13.5px;color:var(--ink2);cursor:pointer}
.segb button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:36px;padding:0 14px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.fchip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav .lbl{flex:1;text-align:center;font-family:var(--font-head);font-weight:600;font-size:15px}
.nav .lbl small{display:block;font-family:var(--font-body);font-weight:500;color:var(--ink2);font-size:12px}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* gün başlıkları */
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 6px;font-weight:700;font-size:13px}
.dayh span{color:var(--ink2);font-weight:600;font-size:12px}
.dayh.today{color:var(--accent)}

/* grafik */
.bars{display:flex;gap:6px;align-items:flex-end;height:150px;margin-top:6px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar .col{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;background:var(--surface2)}
.bar .col i{display:block}
.bar .col .o{background:var(--ozel)}.bar .col .g{background:var(--grup)}
.bar .v{height:14px;line-height:14px;color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* form */
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);margin-top:14px}
.fl input,.fl select,.fl textarea,.srch{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);color:var(--ink);font-size:16px;font-weight:500}
.fl textarea{padding:10px 12px;resize:vertical}
.fl .hint,.hint{font-size:12px;font-weight:500;color:var(--ink2)}
.srch{margin-top:10px}
.seg2{display:flex;gap:6px}
.seg2 input{position:absolute;opacity:0;pointer-events:none}
.seg2 label{flex:1;display:grid;place-items:center;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer;text-align:center;padding:0 8px}
.seg2 input:checked+label{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg2 input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:6px;font-weight:600;color:var(--ink);font-size:15px}
.chk input{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--accent)}
.chk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chk em{font-style:normal;font-size:12px;color:var(--ink2);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fl{min-width:0}

/* sayfa (sheet) */
.ov{position:fixed;inset:0;background:rgba(10,16,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.sh-body{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}

/* alt sekmeler */
#tabs{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:center;
  padding:calc(4px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
#tabs .in{display:flex;width:100%;max-width:560px}
#tabs button{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--ink2);font-size:11px;font-weight:700;min-height:52px;padding:2px 0 6px;cursor:pointer}
#tabs button[aria-current=page]{color:var(--accent)}
#tabs button[aria-current=page]::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
#tabs span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.empty{text-align:center;padding:26px 16px;color:var(--ink2);border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{font-size:12.5px;color:var(--ink2);margin-top:8px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.banner button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer;min-height:36px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}
/* dönem tablosu */
.pgrid{display:grid;grid-template-columns:50px repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.pgh{text-align:center;font-size:11px;font-weight:700;color:var(--ink2);padding:2px 0}
.pc{min-width:0;min-height:66px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink);font-size:13px}
.pc b{font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pc i{font-style:normal;font-size:9px;color:var(--ink2);line-height:1}
.pc small{font-size:9.5px;color:var(--ink2);font-weight:700;line-height:1;margin-top:auto;white-space:nowrap}
.pc.out{background:transparent;border-style:dashed;opacity:.4;cursor:default}
.pc.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pc.today b{color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
.dots u{width:8px;height:8px;border-radius:50%;display:block;text-decoration:none}
.dots u.o{background:var(--ozel)}.dots u.g{background:var(--grup)}
.dots u.o.p{background:transparent;box-shadow:inset 0 0 0 2px var(--ozel)}
.dots u.g.p{background:transparent;box-shadow:inset 0 0 0 2px var(--grup)}
.dots u.x{background:var(--ink2);opacity:.45}
.dots s{font-size:9px;text-decoration:none;color:var(--ink2);line-height:8px}
.pw{min-width:0;min-height:66px;border:0;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:12.5px}
.pw small{font-size:10px;font-weight:700}
/* hafta tablosu */
.wgrid{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.wr{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px;align-items:stretch}
.wd{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;cursor:pointer;color:var(--ink);min-height:54px}
.wd span{font-size:11px;font-weight:700;color:var(--ink2)}
.wd b{font-family:var(--font-head);font-size:19px;line-height:1.1;font-weight:600}
.wd small{font-size:10px;font-weight:700;color:var(--ink2)}
.wd.today{border-color:var(--accent);background:var(--accent-soft)}
.wd.today b,.wd.today span{color:var(--accent)}
.wc{display:flex;flex-direction:column;gap:4px;min-width:0}
.wl{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;border:1px solid var(--line);border-left-width:4px;border-radius:10px;background:var(--surface);padding:6px 10px;cursor:pointer;color:var(--ink)}
.wl.o{border-left-color:var(--ozel)}.wl.g{border-left-color:var(--grup)}
.wt{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;line-height:1.2;min-width:40px}
.wt b{font-size:13px}.wt i{font-style:normal;font-size:11px;color:var(--ink2)}
.wn{flex:1;min-width:0;display:flex;flex-direction:column}
.wn b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wn small{font-size:11.5px;color:var(--ink2)}
.wm{font-size:15px;font-weight:700;color:var(--ok);flex:none}
.wl.planli .wm{color:var(--accent)}
.wl.iptal_ogrenci .wm,.wl.iptal_ben .wm{color:var(--warn)}
.wl.iptal_ogrenci .wn b,.wl.iptal_ben .wn b{text-decoration:line-through;opacity:.7}
.wadd{border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--ink2);min-height:54px;font-size:13px;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<nav id="tabs" aria-label="Ana gezinme"><div class="in" id="tabsin"></div></nav>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- yardımcılar ---------- */
var TR_M=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var TR_MS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
var TR_D=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
var TR_DF=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseD=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
var weekStart=function(s){var d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
var ymOf=function(s){return s.slice(0,7)};
var addMonths=function(ym,n){var p=ym.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var today=function(){return iso(new Date())};
var dow=function(s){return (parseD(s).getDay()+6)%7};
var fmtDay=function(s){var d=parseD(s);return TR_D[dow(s)]+' '+d.getDate()+' '+TR_MS[d.getMonth()]};
var fmtDayLong=function(s){var d=parseD(s);return d.getDate()+' '+TR_M[d.getMonth()]+' '+TR_DF[dow(s)]};
var fmtYM=function(ym){var p=ym.split('-');return TR_M[p[1]-1]+' '+p[0]};
function fmtWeek(ws){var a=parseD(ws),b=parseD(addDays(ws,6));
  return a.getMonth()===b.getMonth()?a.getDate()+'–'+b.getDate()+' '+TR_MS[b.getMonth()]+' '+b.getFullYear()
    :a.getDate()+' '+TR_MS[a.getMonth()]+' – '+b.getDate()+' '+TR_MS[b.getMonth()]+' '+b.getFullYear()}
function money(n){n=Number(n)||0;var neg=n<0,a=Math.abs(n);var r=Math.abs(a-Math.round(a))<0.005?Math.round(a):a;
  return (neg?'−':'')+'₺'+r.toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2})}
var hrs=function(m){return (m/60).toLocaleString('tr-TR',{maximumFractionDigits:1})+' sa'};
var dur=function(m){var h=Math.floor(m/60),r=m%60;return h?(r?h+' sa '+r+' dk':h+' sa'):r+' dk'};
var toMin=function(t){var p=(t||'0:0').split(':').map(Number);return p[0]*60+p[1]};
var fromMin=function(m){return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
var $=function(s,r){return (r||document).querySelector(s)};
var clean=function(o){return JSON.parse(JSON.stringify(o))};
var byName=function(a,b){return (a.name||'').localeCompare(b.name||'','tr')};
var byDT=function(a,b){return (a.date+a.start).localeCompare(b.date+b.start)};

/* ---------- hesaplamalar ---------- */
var ST={planli:'Planlı',yapildi:'Yapıldı',iptal_ogrenci:'Öğrenci iptal',iptal_ben:'İptal (ben)'};
var lessonMins=function(l){return Math.max(0,toMin(l.end)-toMin(l.start))};
function chargesOf(l){
  var out=[];
  if(l.kind!=='grup'){
    var s=SM.get(l.studentId); if(!s||s.billing!=='ders')return out;
    if(l.status==='yapildi'||(l.status==='iptal_ogrenci'&&l.charge))
      out.push({sid:s.id,amount:(l.fee!=null&&l.fee!=='')?Number(l.fee):Number(s.rate||0)});
  }else if(l.status==='yapildi'){
    Object.keys(l.att||{}).forEach(function(sid){
      if(!l.att[sid])return; var s=SM.get(sid);
      if(s&&s.billing==='ders')out.push({sid:sid,amount:Number(s.rate||0)});
    });
  }
  return out;
}
var lessonFee=function(l){return chargesOf(l).reduce(function(a,c){return a+c.amount},0)};
/* Aylık ücretler dönem (16–15) bazında yazılır. "months" listesi dönem başlangıç tarihlerini taşır. */
function sMonths(s){var a=periodStartOf(s.start||today()),e=periodStartOf(s.end||today()),out=[],m=a,g=0;
  while(m<=e&&g<600){out.push(m);m=shiftPeriod(m,1);g++}return out}
function inRange(s,pk){var a=s.start?periodStartOf(s.start):'0000-00-00',e=s.end?periodStartOf(s.end):'9999-99-99';return pk>=a&&pk<=e}
function statsFor(s,from,to,months){
  var n=0,mins=0,fee=0,monthly=0,paid=0;
  C.lessons.forEach(function(l){
    if(l.date<from||l.date>to)return;
    if(l.kind==='grup'){if(!(l.att&&l.att[s.id]))return}else if(l.studentId!==s.id)return;
    if(l.status==='yapildi'){n++;mins+=lessonMins(l)}
    chargesOf(l).forEach(function(c){if(c.sid===s.id)fee+=c.amount});
  });
  if(s.billing==='aylik')months.forEach(function(ym){if(inRange(s,ym))monthly+=Number(s.monthly||0)});
  C.payments.forEach(function(p){if(p.studentId===s.id&&p.date>=from&&p.date<=to)paid+=Number(p.amount)||0});
  return {n:n,mins:mins,fee:fee,monthly:monthly,charge:fee+monthly,paid:paid};
}
var ALL_FROM='0000-00-00',ALL_TO='9999-99-99';
var statsAll=function(s){return statsFor(s,ALL_FROM,ALL_TO,sMonths(s))};
var balance=function(s){var a=statsAll(s);return Number(s.opening||0)+a.charge-a.paid};
var periodWeek=function(ws){return {from:ws,to:addDays(ws,6),months:[]}};
function periodOf(pk){return {from:pk,to:periodEndOf(pk),months:[pk]}}
/* Dönem başında devreden bakiye: önceki dönemlerin ücreti ile ödemeleri arasındaki fark (önceki borç dahil). */
function carryTotal(pk){return C.students.reduce(function(a,s){var c=carryAt(s,pk);return a+(c>0.5?c:0)},0)}
function carryAt(s,pk){
  if(!s.start||periodStartOf(s.start)>pk)return 0;
  var pre=statsFor(s,ALL_FROM,addDays(pk,-1),sMonths(s).filter(function(x){return x<pk}));
  return Number(s.opening||0)+pre.charge-pre.paid;
}
function totals(p){
  var T={nO:0,nG:0,mO:0,mG:0,planned:0,cancelled:0,charge:0,paid:0};
  C.lessons.forEach(function(l){
    if(l.date<p.from||l.date>p.to)return; var m=lessonMins(l);
    if(l.status==='yapildi'){if(l.kind==='grup'){T.nG++;T.mG+=m}else{T.nO++;T.mO+=m}}
    else if(l.status==='planli')T.planned++; else T.cancelled++;
  });
  C.students.forEach(function(s){T.charge+=statsFor(s,p.from,p.to,p.months).charge});
  C.payments.forEach(function(x){if(x.date>=p.from&&x.date<=p.to)T.paid+=Number(x.amount)||0});
  return T;
}
var lname=function(l){return l.kind==='grup'?((GM.get(l.groupId)||{}).name||'Silinmiş grup'):((SM.get(l.studentId)||{}).name||'Silinmiş öğrenci')};
var gname=function(s){return s.type==='grup'?((GM.get(s.groupId)||{}).name||'Grup'):''};

/* ---------- küçük parçalar ---------- */
var chip=function(k){return '<span class="chip '+(k==='grup'?'grup':'ozel')+'">'+(k==='grup'?'Grup':'Özel')+'</span>'};
function statusPill(l){
  if(l.status==='yapildi')return '<span class="chip ok">Yapıldı</span>';
  if(l.status==='planli')return '<span class="chip info">Planlı</span>';
  if(l.status==='iptal_ogrenci')return '<span class="chip warn">Öğrenci iptal'+(l.charge?' · ücretli':'')+'</span>';
  return '<span class="chip warn">İptal (ben)</span>';
}
function balChip(b){
  if(b>0.5)return '<span class="chip bad">Borç '+money(b)+'</span>';
  if(b<-0.5)return '<span class="chip info">Fazla '+money(-b)+'</span>';
  return '<span class="chip ok">Ödendi</span>';
}
var billText=function(s){return s.billing==='aylik'?money(s.monthly)+' / ay':money(s.rate)+' / ders'};
var studentMeta=function(s){return s.type==='grup'?'Grup · '+esc(gname(s)):'Özel'};
var empty=function(t,d){return '<div class="empty"><b>'+t+'</b>'+(d||'')+'</div>'};
function tile(k,v,s,cls){return '<div class="tile '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'}
function lessonRow(l,o){
  o=o||{}; var fee=lessonFee(l),g=l.kind==='grup';
  var n=g?Object.keys(l.att||{}).filter(function(k){return l.att[k]}).length:0;
  var tm=o.showDate?'<span class="tm wide"><b>'+fmtDay(l.date)+'</b><i>'+l.start+'–'+l.end+'</i></span>':'<span class="tm"><b>'+l.start+'</b><i>'+l.end+'</i></span>';
  return '<div class="row"><button class="main" data-act="editLesson" data-id="'+l.id+'">'+tm+
    '<span class="grow"><span class="nm">'+esc(o.showDate&&o.hideName?'':lname(l))+'</span><span class="sub">'+chip(l.kind)+statusPill(l)+
    (g?'<span>'+n+' kişi</span>':'')+(l.topic?'<span>'+esc(l.topic)+'</span>':'')+'</span></span>'+
    (fee?'<span class="amt">'+money(fee)+'</span>':'')+'</button>'+
    (o.quick&&l.status==='planli'?'<button class="done" data-act="markDone" data-id="'+l.id+'" aria-label="Yapıldı olarak işaretle">'+icon('check')+'<span>Yapıldı</span></button>':'')+'</div>';
}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2400)}
function fail(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'Depolama sınırına ulaşıldı.':'Kaydedilemedi. Bağlantını kontrol edip tekrar dene.')}

async function put(col,obj,id){
  var ref=id?db.collection(col).doc(id):db.collection(col).doc();
  var d=Object.assign({},obj);delete d.id;await ref.set(clean(d));return ref.id;
}
var rm=function(col,id){return db.collection(col).doc(id).delete()};

function ph(title,sub,right){return '<div class="ph"><div><h1>'+title+'</h1>'+(sub?'<div class="d">'+sub+'</div>':'')+'</div>'+(right||'')+'</div>'}

  h+='<div class="sec"><div class="sh"><h3>Bu hafta</h3><button class="link" data-act="goTab" data-t="dersler">Dersleri aç</button></div><div class="strip">'+
    '<div><div class="k">Ders</div><div class="v">'+(tw.nO+tw.nG)+'</div></div><div><div class="k">Saat</div><div class="v">'+hrs(tw.mO+tw.mG)+'</div></div><div><div class="k">Tahsilat</div><div class="v">'+money(tw.paid)+'</div></div></div></div>';
  h+='<div class="sec"><div class="sh"><h3>Bu dönem · '+fmtPeriod(pkNow)+'</h3><button class="link" data-act="goTab" data-t="rapor">Rapor</button></div><div class="tiles">'+
    tile('Ders saati',hrs(tm.mO+tm.mG),'Özel '+hrs(tm.mO)+' · Grup '+hrs(tm.mG))+tile('Ders sayısı',String(tm.nO+tm.nG),'Özel '+tm.nO+' · Grup '+tm.nG)+
    tile('Dönem ücreti',money(tm.charge),'Yalnızca bu dönemin dersleri')+tile('Tahsil edilen',money(tm.paid),'Bu dönemde alınan ödemeler','ok')+

  if(next.length)h+='<div class="sec"><div class="sh"><h3>Yaklaşan dersler</h3></div><div class="stack">'+next.map(function(l){return lessonRow(l,{showDate:true})}).join('')+'</div></div>';

function studentRow(s,b){
  return '<div class="row"><button class="main" data-act="viewStudent" data-id="'+s.id+'"><span class="grow"><span class="nm">'+esc(s.name)+'</span><span class="sub">'+

}
function studentListHtml(){
  var q=V.q.trim().toLocaleLowerCase('tr');
  var items=C.students.map(function(s){return {s:s,b:balance(s)}}).filter(function(x){
    var s=x.s;
    if(V.filter==='arsiv')return s.active===false;
    if(s.active===false)return false;
    if(V.filter==='ozel')return s.type!=='grup';
    if(V.filter==='grup')return s.type==='grup';
    if(V.filter==='borc')return x.b>0.5;
    return true;
  });
  if(q)items=items.filter(function(x){return (x.s.name||'').toLocaleLowerCase('tr').indexOf(q)>-1||(x.s.phone||'').indexOf(q)>-1});
  items.sort(function(a,b){return byName(a.s,b.s)});
  if(!items.length)return empty(C.students.length?'Eşleşen öğrenci yok':'Henüz öğrenci yok',C.students.length?'':'Sağ alttaki düğmeyle ilk öğrencini ekle.');
  return '<div class="stack">'+items.map(function(x){return studentRow(x.s,x.b)}).join('')+'</div>';
}
function groupListHtml(){
  if(!C.groups.length)return empty('Henüz grup yok','Ücretleri farklı öğrencileri tek grupta toplayabilirsin. Önce grubu ekle, sonra öğrencileri bu gruba ata.');
  return '<div class="stack">'+C.groups.slice().sort(byName).map(function(g){
    var m=C.students.filter(function(s){return s.groupId===g.id&&s.active!==false}).length;
    var n=C.lessons.filter(function(l){return l.kind==='grup'&&l.groupId===g.id&&l.status==='yapildi'}).length;
    return '<div class="row"><button class="main" data-act="editGroup" data-id="'+g.id+'"><span class="grow"><span class="nm">'+esc(g.name)+'</span><span class="sub"><span>'+m+' öğrenci</span><span>'+n+' ders yapıldı</span>'+(g.note?'<span>'+esc(g.note)+'</span>':'')+'</span></span></button></div>';
  }).join('')+'</div>';

function periodStartOf(s){var d=parseD(s),m=d.getMonth();if(d.getDate()<16)m--;return iso(new Date(d.getFullYear(),m,16))}
function periodEndOf(ps){var d=parseD(ps);return iso(new Date(d.getFullYear(),d.getMonth()+1,15))}
function shiftPeriod(ps,n){var d=parseD(ps);return iso(new Date(d.getFullYear(),d.getMonth()+n,16))}
function fmtPeriod(ps){var a=parseD(ps),b=parseD(periodEndOf(ps));return a.getDate()+' '+TR_MS[a.getMonth()]+' – '+b.getDate()+' '+TR_MS[b.getMonth()]+' '+b.getFullYear()}
function dotClass(l){var k=l.kind==='grup'?'g':'o';return l.status==='yapildi'?k:l.status==='planli'?k+' p':'x'}
function lessonsView(){return V.lv==='week'?weekView():periodView()}
function periodView(){
  var ps=V.period,pe=periodEndOf(ps),t=today(),p=periodOf(ps),T=totals(p),carry=carryTotal(ps);
  var by={};C.lessons.forEach(function(l){if(l.date>=ps&&l.date<=pe)(by[l.date]=by[l.date]||[]).push(l)});
  var h=ph('Dersler');
  h+=navBar(fmtPeriod(ps),ps===periodStartOf(t)?'Bu dönem':'Etikete dokununca bu döneme dön','pPrev','pNext','pNow');
  h+='<div class="strip"><div><div class="k">Yapılan</div><div class="v">'+(T.nO+T.nG)+' ders</div></div><div><div class="k">Saat</div><div class="v">'+hrs(T.mO+T.mG)+'</div></div><div><div class="k">Planlı</div><div class="v">'+T.planned+'</div></div></div>'+
    '<div class="strip" style="margin-top:8px"><div><div class="k">Dönem ücreti</div><div class="v">'+money(T.charge)+'</div></div><div><div class="k">Tahsil edilen</div><div class="v">'+money(T.paid)+'</div></div><div><div class="k">Devreden borç</div><div class="v"'+(carry>0.5?' style="color:var(--bad)"':'')+'>'+money(carry)+'</div></div></div>';
  h+='<div class="pgrid"><div class="pgh">Hafta</div>'+TR_D.map(function(x){return '<div class="pgh">'+x+'</div>'}).join('');
  for(var ws=weekStart(ps);ws<=pe;ws=addDays(ws,7)){
    var wm=0,cells='',wf=ws<ps?ps:ws,we0=addDays(ws,6),we=we0>pe?pe:we0;
    for(var i=0;i<7;i++){
      var d=addDays(ws,i),inP=d>=ps&&d<=pe,ls=by[d]||[],dd=parseD(d);
      if(!inP){cells+='<div class="pc out"><b>'+dd.getDate()+'</b></div>';continue}

function buckets(p,week){
  var items=[],i;
  if(week){for(i=0;i<7;i++){var d=addDays(V.repWeek,i);items.push({label:TR_D[i],from:d,to:d,o:0,g:0})}}
  else{var ws=weekStart(p.from);while(ws<=p.to){var f=ws<p.from?p.from:ws,e0=addDays(ws,6),e=e0>p.to?p.to:e0;
    items.push({label:parseD(f).getDate()+'–'+parseD(e).getDate(),from:f,to:e,o:0,g:0});ws=addDays(ws,7)}}
  C.lessons.forEach(function(l){
    if(l.status!=='yapildi')return;
    items.forEach(function(it){if(l.date>=it.from&&l.date<=it.to){if(l.kind==='grup')it.g+=lessonMins(l);else it.o+=lessonMins(l)}});
  });
  return items;

/* ders */

  if(att)Object.keys(att).forEach(function(k){var s=SM.get(k);if(s)ms.set(k,s)});

  return Array.from(ms.values()).sort(byName).map(function(s){
    return '<label class="chk"><input type="checkbox" data-sid="'+s.id+'"'+((fresh||(att&&att[s.id]))?' checked':'')+'><span>'+esc(s.name)+'</span><em>'+(s.billing==='ders'?money(s.rate):'aylık')+'</em></label>'}).join('');

   '<label class="fl">Konu / not<input id="f-topic" value="'+esc(d.topic||'')+'" placeholder="Örn. Türev, 3. ünite tekrar"></label>'+

        if(l){await put('lessons',Object.assign({},l,base,{date:date,status:st}),id);return}
        for(var i=0;i<rep;i++){var di=addDays(date,7*i);

      });
    });
    var b=$('#b-del',sh);if(b)armDelete(b,function(){return rm('lessons',id)});
  });
}

function csv(rows){return '﻿'+rows.map(function(r){return r.map(function(c){c=c==null?'':String(c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\r\n')}
var nc=function(n){return String(Math.round((Number(n)||0)*100)/100).replace('.',',')};
async function exportCsv(kind){
  var rows,name;
  var pl=function(d){return fmtPeriod(periodStartOf(d))};
  if(kind==='lessons'){name='dersler.csv';rows=[['Dönem','Tarih','Başlangıç','Bitiş','Süre (dk)','Tür','Öğrenci / Grup','Durum','Konu','Ücret (₺)']].concat(
    C.lessons.slice().sort(byDT).map(function(l){return [pl(l.date),l.date,l.start,l.end,lessonMins(l),l.kind==='grup'?'Grup':'Özel',lname(l),ST[l.status]||'',l.topic||'',nc(lessonFee(l))]}))}
  else if(kind==='payments'){name='odemeler.csv';rows=[['Dönem','Tarih','Öğrenci','Tutar (₺)','Yöntem','Not']].concat(
    C.payments.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).map(function(p){return [pl(p.date),p.date,(SM.get(p.studentId)||{}).name||'',nc(p.amount),p.method||'',p.note||'']}))}
  else{name='ogrenci-donem-ozeti.csv';var pk=V.repPeriod,pp=periodOf(pk);
    rows=[['Dönem: '+fmtPeriod(pk)],['Öğrenci','Tür','Grup','Ücret şekli','Ücret (₺)','Dönem dersi','Dönem saati','Dönem ücreti (₺)','Dönem ödemesi (₺)','Devreden (₺)','Dönem sonu bakiye (₺)','Durum']].concat(
    C.students.slice().sort(byName).map(function(s){var a=statsFor(s,pp.from,pp.to,[pk]),c=carryAt(s,pk);return [s.name,s.type==='grup'?'Grup':'Özel',gname(s),s.billing==='aylik'?'Aylık':'Ders başı',nc(s.billing==='aylik'?s.monthly:s.rate),a.n,nc(a.mins/60),nc(a.charge),nc(a.paid),nc(c),nc(c+a.charge-a.paid),s.active===false?'Arşiv':'Aktif']}))}
  try{await dl.save({filename:name,data:csv(rows)})}catch(e){if(!e||e.code!=='declined')toast('Dosya kaydedilemedi')}
}

/* ---------- örnek veri ---------- */
async function loadSample(){
  var t=today(),ws=weekStart(t);
  var mk=async function(col,o){return put(col,Object.assign({sample:true},o))};
  try{
    toast('Örnek veriler yükleniyor…');
    var g1=await mk('groups',{name:'Cumartesi Matematik',note:'Cumartesi 10:00'});
    var s1=await mk('students',{name:'Elif Yılmaz',phone:'',type:'ozel',billing:'ders',rate:600,monthly:0,start:addDays(t,-60),opening:0,active:true,note:'9. sınıf matematik'});
    var s2=await mk('students',{name:'Mert Kaya',phone:'',type:'ozel',billing:'aylik',rate:0,monthly:3000,start:addDays(t,-45),opening:0,active:true,note:'Aylık paket'});
    var s3=await mk('students',{name:'Zeynep Arslan',phone:'',type:'grup',groupId:g1,billing:'ders',rate:350,monthly:0,start:addDays(t,-50),opening:0,active:true});
    var s4=await mk('students',{name:'Can Demir',phone:'',type:'grup',groupId:g1,billing:'ders',rate:300,monthly:0,start:addDays(t,-50),opening:0,active:true});
    var s5=await mk('students',{name:'Deniz Aydın',phone:'',type:'grup',groupId:g1,billing:'aylik',rate:0,monthly:1200,start:addDays(t,-40),opening:0,active:true});
    var jobs=[];
    for(var w=-4;w<=1;w++){
      var base=addDays(ws,7*w);
      [[1,s1,'17:00','18:00'],[3,s1,'17:00','18:00'],[2,s2,'18:00','19:30']].forEach(function(x){
        var d=addDays(base,x[0]);
        jobs.push(['lessons',{kind:'ozel',studentId:x[1],date:d,start:x[2],end:x[3],status:d<=t?(w===-2&&x[1]===s2?'iptal_ogrenci':'yapildi'):'planli',topic:'',charge:false,fee:null}]);
      });
      var gd=addDays(base,5),att={};att[s3]=true;att[s4]=(w!==-1);att[s5]=true;
      jobs.push(['lessons',{kind:'grup',groupId:g1,date:gd,start:'10:00',end:'12:00',status:gd<=t?'yapildi':'planli',topic:'',charge:false,fee:null,att:att}]);
    }
    jobs.push(['payments',{studentId:s1,date:addDays(t,-20),amount:3000,method:'Havale/EFT',note:''}]);
    jobs.push(['payments',{studentId:s2,date:addDays(t,-25),amount:3000,method:'Nakit',note:'Geçen ay'}]);
    jobs.push(['payments',{studentId:s3,date:addDays(t,-12),amount:1400,method:'Nakit',note:''}]);
    jobs.push(['payments',{studentId:s5,date:addDays(t,-30),amount:1200,method:'Havale/EFT',note:''}]);
    for(var i=0;i<jobs.length;i+=6)await Promise.all(jobs.slice(i,i+6).map(function(j){return mk(j[0],j[1])}));
    toast('Örnek veriler yüklendi');
  }catch(e){fail(e)}
}
async function clearSample(){
  try{
    var all=[];['students','groups','lessons','payments'].forEach(function(c){C[c].forEach(function(x){if(x.sample)all.push([c,x.id])})});
    for(var i=0;i<all.length;i+=6)await Promise.all(all.slice(i,i+6).map(function(a){return rm(a[0],a[1])}));
    toast('Örnek veriler silindi');
  }catch(e){fail(e)}
}

  openWeek:function(el){V.weekStart=el.dataset.w;V.lv='week';render();window.scrollTo(0,0)},
  backPeriod:function(){V.lv='period';render();window.scrollTo(0,0)},
  pPrev:function(){V.period=shiftPeriod(V.period,-1);render()},pNext:function(){V.period=shiftPeriod(V.period,1);render()},pNow:function(){V.period=periodStartOf(today());render()},
  markDone:async function(el){var inSheet=!!el.closest('#ov');try{await db.collection('lessons').doc(el.dataset.id).update({status:'yapildi'});if(inSheet)closeSheet();toast('Yapıldı olarak işaretlendi')}catch(e){fail(e)}},
  newPayment:function(el){paymentSheet(null,{studentId:el.dataset.sid||''})},editPayment:function(el){paymentSheet(el.dataset.id)},
  seg:function(el){V.seg=el.dataset.v;render()},filter:function(el){V.filter=el.dataset.v;render()},
  wPrev:function(){V.weekStart=addDays(V.weekStart,-7);render()},wNext:function(){V.weekStart=addDays(V.weekStart,7);render()},wNow:function(){V.weekStart=weekStart(today());render()},
  mPrev:function(){V.payPeriod=shiftPeriod(V.payPeriod,-1);render()},mNext:function(){V.payPeriod=shiftPeriod(V.payPeriod,1);render()},mNow:function(){V.payPeriod=periodStartOf(today());render()},
  rmode:function(el){V.repMode=el.dataset.v;render()},
  rPrev:function(){if(V.repMode==='hafta')V.repWeek=addDays(V.repWeek,-7);else V.repPeriod=shiftPeriod(V.repPeriod,-1);render()},
  rNext:function(){if(V.repMode==='hafta')V.repWeek=addDays(V.repWeek,7);else V.repPeriod=shiftPeriod(V.repPeriod,1);render()},
  rNow:function(){V.repWeek=weekStart(today());V.repPeriod=periodStartOf(today());render()},
  exp:function(el){exportCsv(el.dataset.v)},backup:backupNow,restore:pickRestore,sample:loadSample,clearSample:clearSample
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=ACT[t.dataset.act];if(f)f(t,e)});
document.addEventListener('input',function(e){if(e.target.id==='q'){V.q=e.target.value;var l=$('#slist');if(l)l.innerHTML=studentListHtml()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
function tabFromHash(){var h=location.hash.replace('#','');if(VIEWS[h])V.tab=h}
window.addEventListener('hashchange',function(){tabFromHash();render()});

/* ---------- yerel veri katmanı (telefonun tarayıcısında saklanır) ---------- */
var STORE_KEY='dersdefteri.v1',BK_KEY='dersdefteri.sonyedek',COLS=['students','groups','lessons','payments'];
var mem={students:{},groups:{},lessons:{},payments:{}},persistOk=true,warned=false,listeners={students:[],groups:[],lessons:[],payments:[]};
function loadStore(){
  try{var r=localStorage.getItem(STORE_KEY);if(r){var o=JSON.parse(r);COLS.forEach(function(k){mem[k]=o[k]||{}})}}
  catch(e){persistOk=false}
}
function saveStore(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(mem))}
  catch(e){persistOk=false;if(!warned){warned=true;toast('Bu tarayıcı kayıt yapmıyor. Veriler sayfa kapanınca silinir.')}}
}
function snapOf(n){return {docs:Object.keys(mem[n]).map(function(id){return {id:id,data:function(){return JSON.parse(JSON.stringify(mem[n][id]))}}})}}
function emit(n){listeners[n].slice().forEach(function(f){f(snapOf(n))})}
var newId=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
db={collection:function(n){return {
  onSnapshot:function(next){listeners[n].push(next);setTimeout(function(){next(snapOf(n))},0);return function(){listeners[n]=listeners[n].filter(function(f){return f!==next})}},
  doc:function(id){id=id||newId();return {id:id,
    set:async function(d){mem[n][id]=d;saveStore();emit(n)},
    update:async function(d){if(!mem[n][id])throw new Error('yok');Object.assign(mem[n][id],d);saveStore();emit(n)},
    delete:async function(){delete mem[n][id];saveStore();emit(n)}}}}}};
function download(name,data,type){
  var a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:type}));
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u)},1500);
}
dl={save:async function(o){download(o.filename,o.data,/\.json$/.test(o.filename)?'application/json':'text/csv;charset=utf-8')}};

/* yedek al / yedekten yükle */
function lastBackup(){try{return localStorage.getItem(BK_KEY)||''}catch(e){return ''}}
function backupNow(){
  var o={app:'ders-defteri',version:1,saved:new Date().toISOString()};COLS.forEach(function(k){o[k]=mem[k]});
  download('ders-defteri-yedek-'+today()+'.json',JSON.stringify(o),'application/json');
  try{localStorage.setItem(BK_KEY,today())}catch(e){}
  toast('Yedek dosyası indirildi');render();
}
function pickRestore(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var o;try{o=JSON.parse(r.result)}catch(e){toast('Bu dosya okunamadı');return}
      if(!o||o.app!=='ders-defteri'||!o.students){toast('Bu bir Ders Defteri yedeği değil');return}
      var cnt=function(k){return Object.keys(o[k]||{}).length};
      openSheet('Yedeği yükle','<p>Yedekte <b>'+cnt('students')+' öğrenci</b>, <b>'+cnt('lessons')+' ders</b> ve <b>'+cnt('payments')+' ödeme</b> var'+(o.saved?' ('+esc(String(o.saved).slice(0,10))+')':'')+'.</p><p class="note">Yüklersen şu anki tüm verilerin yedektekilerle değiştirilir.</p><div class="btns"><button class="btn danger" id="doRestore" type="button">Yedeği yükle</button><button class="btn ghost" data-act="close" type="button">Vazgeç</button></div>',function(sh){
        var b=$('#doRestore',sh),armed=false;
        b.addEventListener('click',function(){
          if(!armed){armed=true;b.textContent='Emin misin? Tekrar dokun';return}
          COLS.forEach(function(k){mem[k]=o[k]||{}});saveStore();COLS.forEach(emit);closeSheet();toast('Yedek yüklendi');
        });
      });
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- başlangıç ---------- */
loadStore();
window.addEventListener('storage',function(e){if(e.key===STORE_KEY){loadStore();COLS.forEach(emit)}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
tabFromHash();dbState='ok';render();
COLS.forEach(function(n){
  db.collection(n).onSnapshot(function(snap){
    C[n]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    loaded[n]=true;render();
  });
});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
